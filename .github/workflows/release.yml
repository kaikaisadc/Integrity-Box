name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Build modern artifacts (integrity-box branch)
        working-directory: PlayIntegrityFork
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Build legacy artifacts (legacy branch)
        run: |
          git clone --depth 1 --branch legacy \
            https://github.com/MeowDump/PlayIntegrityFork.git "$RUNNER_TEMP/pif-legacy"
          cd "$RUNNER_TEMP/pif-legacy"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Package module zip
        run: |
          chmod +x build.sh
          ./build.sh \
            --pifork-artifacts PlayIntegrityFork/module \
            --legacy-artifacts "$RUNNER_TEMP/pif-legacy/module"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: Integrity-Box-module
          path: build/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" build/*.zip --title "$GITHUB_REF_NAME" --generate-notes
